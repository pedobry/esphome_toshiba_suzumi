# Change these to name the device and the AC. climate_id is used in lambdas.
substitutions:
  device_name: climate-living-room
  climate_name: Living Room
  climate_id: living_room

esphome:
  name: ${device_name}

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

external_components:
  - source:
      type: git
      url: https://github.com/pedobry/esphome_toshiba_suzumi
    components: [toshiba_suzumi]

logger:
  level: info

uart:
  id: uart_bus
  tx_pin: 33
  rx_pin: 32
  parity: EVEN
  baud_rate: 9600

climate:
  - platform: toshiba_suzumi
    name: ${climate_name}
    id: ${climate_id}
    uart_id: uart_bus
    # Supported features, presets and entities are detected automatically
    # (the device restarts once after the first detection). Everything else is
    # optional, see README.md for the full list, e.g.:
    #time_id: hass_time      # needed for energy / power on units that have them
    #outdoor_temp:           # listing an entity always shows it with your name
    #  name: Outdoor Temp
    #supported_presets:      # replaces the detected presets
    #  - "Sleep"
    #disable_wifi_led: true

button:
  # Optional. Forget the detected unit features and detect them again (restarts the ESP).
  - platform: template
    name: "Detect AC features again"
    icon: "mdi:magnify-scan"
    entity_category: config
    on_press:
      then:
        - lambda: id(${climate_id}).reset_capabilities();

# Enable Home Assistant API
api:
  encryption:
    key: !secret ha_enc_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${device_name} fallback"
    password: "xxxxxxxxxxx"

captive_portal:
