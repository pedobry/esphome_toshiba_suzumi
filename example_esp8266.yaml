esphome:
  name: "climate-living-room"
  platform: ESP8266
  board: d1_mini

external_components:
  - source: 
      type: git
      url: https://github.com/pedobry/esphome_toshiba_suzumi
    components: [toshiba_suzumi]

logger:
  level: info

uart:
  id: uart_bus
  tx_pin: 13
  rx_pin: 12
  parity: EVEN
  baud_rate: 9600

climate:
  - platform: toshiba_suzumi
    name: living-room
    id: living_room
    uart_id: uart_bus
    # Supported features, presets and entities are detected automatically
    # (the device restarts once after the first detection). Everything else is
    # optional, see README.md for the full list, e.g.:
    #time_id: hass_time      # needed for energy / power on units that have them
    #outdoor_temp:           # listing an entity always shows it with your name
    #  name: Outdoor Temp
    #supported_presets:      # replaces the detected presets
    #  - "Sleep"
    #disable_wifi_led: true

# Enable button to scan for unknown values in AC unit. This is optional.
button:
  - platform: template
    name: "Scan for unknown sensors"
    icon: "mdi:reload"
    on_press:
      then:
         # id(living_room) is the id of the climate component above
        - lambda: |-
            auto* controller = static_cast<toshiba_suzumi::ToshibaClimateUart*>(id(living_room));
            controller->scan();

# Enable Home Assistant API
api:
  encryption:
    key: !secret ha_enc_key

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "A Fallback Hotspot"
    password: "xxxxxxxxxxx"

captive_portal:
