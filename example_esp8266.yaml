# Change these to name the device and the AC. climate_id is used in lambdas.
substitutions:
  device_name: climate-living-room
  climate_name: Living Room
  climate_id: living_room

esphome:
  name: ${device_name}

esp8266:
  board: d1_mini
  # Keep the detected unit features over a power cut (otherwise they are
  # detected again, with one restart, after power is restored).
  restore_from_flash: true

external_components:
  - source:
      type: git
      url: https://github.com/pedobry/esphome_toshiba_suzumi
    components: [toshiba_suzumi]

logger:
  level: info

uart:
  id: uart_bus
  tx_pin: 13
  rx_pin: 12
  parity: EVEN
  baud_rate: 9600

climate:
  - platform: toshiba_suzumi
    name: ${climate_name}
    id: ${climate_id}
    uart_id: uart_bus
    # Supported features, presets and entities are detected automatically
    # (the device restarts once after the first detection). Everything else is
    # optional, see README.md for the full list, e.g.:
    #time_id: hass_time      # needed for energy / power on units that have them
    #outdoor_temp:           # listing an entity always shows it with your name
    #  name: Outdoor Temp
    #supported_presets:      # replaces the detected presets
    #  - "Sleep"
    #disable_wifi_led: true

# Enable Home Assistant API
api:
  encryption:
    key: !secret ha_enc_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${device_name} fallback"
    password: "xxxxxxxxxxx"

captive_portal:
